<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 648" width="1152" height="648">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040611" />
      <stop offset="35%" stop-color="#0c0a20" />
      <stop offset="65%" stop-color="#160f33" />
      <stop offset="88%" stop-color="#231445" />
      <stop offset="100%" stop-color="#2c174e" />
    </linearGradient>

    <!-- Cyan Reality A Nebula Influence -->
    <radialGradient id="nebulaCyan" cx="28%" cy="32%" r="42%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#040611" stop-opacity="0" />
    </radialGradient>

    <!-- Magenta Reality B Nebula Influence -->
    <radialGradient id="nebulaMagenta" cx="76%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.24" />
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#040611" stop-opacity="0" />
    </radialGradient>

    <!-- Horizon Atmospheric Glow -->
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.30" />
    </linearGradient>
  </defs>

  <!-- Deep Cosmos Base -->
  <rect width="1152" height="648" fill="url(#skyGrad)" />
  <rect width="1152" height="648" fill="url(#nebulaCyan)" />
  <rect width="1152" height="648" fill="url(#nebulaMagenta)" />
  <rect y="380" width="1152" height="268" fill="url(#horizonGlow)" />

  <!-- Starfield (Group 1: Faint distant stars) -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="45" cy="52" r="0.8" />
    <circle cx="88" cy="180" r="1.0" />
    <circle cx="140" cy="95" r="0.7" />
    <circle cx="210" cy="140" r="1.1" />
    <circle cx="295" cy="65" r="0.9" />
    <circle cx="360" cy="210" r="0.8" />
    <circle cx="430" cy="85" r="1.2" />
    <circle cx="515" cy="165" r="0.7" />
    <circle cx="590" cy="45" r="1.0" />
    <circle cx="670" cy="190" r="0.8" />
    <circle cx="735" cy="115" r="1.1" />
    <circle cx="820" cy="70" r="0.9" />
    <circle cx="895" cy="175" r="1.0" />
    <circle cx="960" cy="90" r="0.8" />
    <circle cx="1040" cy="150" r="1.1" />
    <circle cx="1110" cy="80" r="0.7" />
    <circle cx="75" cy="290" r="1.0" />
    <circle cx="185" cy="330" r="0.8" />
    <circle cx="310" cy="285" r="1.1" />
    <circle cx="470" cy="315" r="0.9" />
    <circle cx="625" cy="295" r="0.7" />
    <circle cx="780" cy="340" r="1.0" />
    <circle cx="930" cy="305" r="0.8" />
    <circle cx="1080" cy="325" r="1.1" />
  </g>

  <!-- Starfield (Group 2: Bright luminous stars with subtle color tinting) -->
  <g opacity="0.85">
    <circle cx="120" cy="72" r="1.6" fill="#bae6fd" />
    <circle cx="260" cy="110" r="1.8" fill="#e0f2fe" />
    <circle cx="390" cy="48" r="1.5" fill="#fbcfe8" />
    <circle cx="560" cy="92" r="2.0" fill="#fdf4ff" />
    <circle cx="680" cy="64" r="1.7" fill="#c7d2fe" />
    <circle cx="850" cy="130" r="1.9" fill="#f5d0fe" />
    <circle cx="990" cy="55" r="1.6" fill="#bae6fd" />
    <circle cx="1065" cy="120" r="1.8" fill="#e9d5ff" />
  </g>

  <!-- Cross-flare on key focal stars -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.7">
    <line x1="260" y1="104" x2="260" y2="116" />
    <line x1="254" y1="110" x2="266" y2="110" />
    <line x1="850" y1="124" x2="850" y2="136" />
    <line x1="844" y1="130" x2="856" y2="130" />
  </g>
</svg>
