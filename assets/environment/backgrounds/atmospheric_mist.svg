<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 648" width="1152" height="648">
  <defs>
    <!-- Soft Volumetric Fog Gradient 1 -->
    <linearGradient id="fogGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Volumetric Fog Gradient 2 -->
    <linearGradient id="fogGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c026d3" stop-opacity="0" />
      <stop offset="50%" stop-color="#e879f9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Horizontal Rolling Fog Wave 1 (Upper Midground: Y=360 to Y=490) -->
  <path d="M 0 420 
           Q 140 370 280 410 
           T 560 400 
           Q 700 440 840 390 
           T 1152 420 
           L 1152 490 
           Q 980 520 840 480 
           T 420 500 
           Q 210 470 0 490 Z" 
        fill="url(#fogGrad1)" />

  <!-- Horizontal Rolling Fog Wave 2 (Lower Ground: Y=480 to Y=620) -->
  <path d="M 0 540 
           Q 200 490 400 530 
           T 800 520 
           Q 980 560 1152 540 
           L 1152 620 
           Q 900 640 700 600 
           T 300 620 
           Q 120 590 0 620 Z" 
        fill="url(#fogGrad2)" />

  <!-- Floating Luminous Dimensional Particles / Energy Motes -->
  <g opacity="0.6">
    <circle cx="95" cy="410" r="1.8" fill="#38bdf8" />
    <circle cx="160" cy="460" r="2.2" fill="#bae6fd" />
    <circle cx="280" cy="390" r="1.5" fill="#38bdf8" />
    <circle cx="370" cy="480" r="2.5" fill="#e0f2fe" />
    <circle cx="490" cy="420" r="1.8" fill="#818cf8" />
    <circle cx="580" cy="470" r="2.2" fill="#c084fc" />
    <circle cx="690" cy="380" r="1.5" fill="#f43f5e" />
    <circle cx="780" cy="450" r="2.4" fill="#fbcfe8" />
    <circle cx="890" cy="410" r="1.8" fill="#f43f5e" />
    <circle cx="980" cy="490" r="2.0" fill="#f472b6" />
    <circle cx="1070" cy="430" r="1.6" fill="#c084fc" />

    <!-- Lower Motes -->
    <circle cx="130" cy="560" r="2.0" fill="#38bdf8" />
    <circle cx="320" cy="530" r="1.6" fill="#818cf8" />
    <circle cx="510" cy="570" r="2.4" fill="#c084fc" />
    <circle cx="720" cy="540" r="1.8" fill="#f43f5e" />
    <circle cx="910" cy="560" r="2.2" fill="#f472b6" />
    <circle cx="1040" cy="530" r="1.5" fill="#38bdf8" />
  </g>
</svg>
