<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 648" width="1152" height="648">
  <defs>
    <!-- Midground Facility Silhouette Fill -->
    <linearGradient id="facilityBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141726" />
      <stop offset="50%" stop-color="#0d0f1a" />
      <stop offset="100%" stop-color="#07080e" />
    </linearGradient>

    <!-- Structural Edge Glow -->
    <linearGradient id="roofGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- 1. Heavy Industrial Skyline Silhouette (Seamless tiling at Y=480 on both boundaries) -->
  <path d="M 0 480 
           L 40 480 L 40 380 L 70 380 L 70 330 L 78 330 L 78 210 L 82 210 L 82 330 L 90 330 L 90 440 
           L 140 440 L 140 370 L 210 370 L 210 460 
           L 260 460 L 260 320 L 310 320 L 310 480 
           L 360 480 L 360 410 L 440 410 L 440 250 L 446 250 L 446 160 L 450 160 L 450 250 L 456 250 L 456 410 L 510 410 L 510 470 
           L 570 470 L 570 350 L 630 350 L 630 450 
           L 680 450 L 680 390 L 760 390 L 760 470 
           L 810 470 L 810 280 L 816 280 L 816 190 L 820 190 L 820 280 L 826 280 L 826 430 L 880 430 L 880 360 L 950 360 L 950 480 
           L 1000 480 L 1000 400 L 1070 400 L 1070 450 L 1110 450 L 1110 480 L 1152 480 
           L 1152 648 L 0 648 Z" 
        fill="url(#facilityBase)" />

  <!-- Observatory Domes (Rounded Research Hubs) -->
  <!-- Dome 1 (Left Wing) -->
  <path d="M 150 370 A 30 30 0 0 1 200 370 Z" fill="#181c2e" stroke="#38bdf8" stroke-width="1.2" opacity="0.8" />
  <line x1="175" y1="340" x2="175" y2="370" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />

  <!-- Dome 2 (Right Wing) -->
  <path d="M 890 360 A 35 35 0 0 1 940 360 Z" fill="#181c2e" stroke="#f43f5e" stroke-width="1.2" opacity="0.8" />
  <line x1="915" y1="325" x2="915" y2="360" stroke="#f43f5e" stroke-width="1.5" opacity="0.9" />

  <!-- Transmission Cables connecting high spires -->
  <g stroke="#262b44" stroke-width="1.0" fill="none" opacity="0.75">
    <path d="M 80 230 Q 260 310 448 180" />
    <path d="M 448 180 Q 630 300 818 210" />
    <path d="M 818 210 Q 980 290 1152 260" />
  </g>

  <!-- High-Altitude Red & Cyan Warning Beacons on Spire Tips -->
  <g>
    <!-- Spire 1 Beacon (Cyan / Moonlit Sector) -->
    <circle cx="80" cy="208" r="3.5" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)" />
    <circle cx="80" cy="208" r="1.5" fill="#ffffff" />

    <!-- Spire 2 Beacon (Central Tall Pylon) -->
    <circle cx="448" cy="158" r="4.0" fill="#a855f7" filter="drop-shadow(0 0 8px #a855f7)" />
    <circle cx="448" cy="158" r="1.8" fill="#ffffff" />

    <!-- Spire 3 Beacon (Magenta / Sunset Sector) -->
    <circle cx="818" cy="188" r="3.5" fill="#f43f5e" filter="drop-shadow(0 0 6px #f43f5e)" />
    <circle cx="818" cy="188" r="1.5" fill="#ffffff" />
  </g>

  <!-- Illuminated Laboratory Window Matrices -->
  <!-- Cyan Lab Cluster (Left: Research Wing) -->
  <g fill="#38bdf8" opacity="0.85">
    <rect x="48" y="400" width="4" height="6" rx="1" />
    <rect x="56" y="400" width="4" height="6" rx="1" />
    <rect x="48" y="412" width="4" height="6" rx="1" />
    <rect x="56" y="412" width="4" height="6" rx="1" />
    <rect x="48" y="424" width="4" height="6" rx="1" />
    <rect x="56" y="424" width="4" height="6" rx="1" />

    <rect x="270" y="340" width="6" height="4" rx="1" />
    <rect x="280" y="340" width="6" height="4" rx="1" />
    <rect x="290" y="340" width="6" height="4" rx="1" />
    <rect x="270" y="352" width="6" height="4" rx="1" />
    <rect x="280" y="352" width="6" height="4" rx="1" />
    <rect x="290" y="352" width="6" height="4" rx="1" />
    <rect x="270" y="364" width="6" height="4" rx="1" />
    <rect x="280" y="364" width="6" height="4" rx="1" />
  </g>

  <!-- Amber/Magenta Lab Cluster (Right: High-Energy Reactor Wing) -->
  <g fill="#f59e0b" opacity="0.85">
    <rect x="585" y="375" width="5" height="5" rx="1" />
    <rect x="595" y="375" width="5" height="5" rx="1" />
    <rect x="605" y="375" width="5" height="5" rx="1" />
    <rect x="585" y="386" width="5" height="5" rx="1" />
    <rect x="595" y="386" width="5" height="5" rx="1" />
    <rect x="605" y="386" width="5" height="5" rx="1" />

    <rect x="700" y="410" width="6" height="4" rx="1" fill="#f43f5e" />
    <rect x="710" y="410" width="6" height="4" rx="1" fill="#f43f5e" />
    <rect x="720" y="410" width="6" height="4" rx="1" fill="#f43f5e" />
    <rect x="730" y="410" width="6" height="4" rx="1" fill="#f43f5e" />
    <rect x="700" y="420" width="6" height="4" rx="1" fill="#f43f5e" />
    <rect x="710" y="420" width="6" height="4" rx="1" fill="#f43f5e" />
    <rect x="720" y="420" width="6" height="4" rx="1" fill="#f43f5e" />
    <rect x="730" y="420" width="6" height="4" rx="1" fill="#f43f5e" />

    <rect x="1015" y="420" width="5" height="8" rx="1" fill="#f59e0b" />
    <rect x="1025" y="420" width="5" height="8" rx="1" fill="#f59e0b" />
    <rect x="1035" y="420" width="5" height="8" rx="1" fill="#f59e0b" />
    <rect x="1045" y="420" width="5" height="8" rx="1" fill="#f59e0b" />
  </g>

  <!-- Cool Roof Edge Trim Highlight -->
  <path d="M 0 480 L 40 480 L 40 380 L 70 380 L 90 440 L 140 440 L 140 370 L 210 370 L 210 460 L 260 460 L 260 320 L 310 320 L 310 480 L 360 480 L 360 410 L 440 410 L 456 410 L 510 410 L 510 470 L 570 470 L 570 350 L 630 350 L 630 450 L 680 450 L 680 390 L 760 390 L 760 470 L 810 470 L 826 430 L 880 430 L 880 360 L 950 360 L 950 480 L 1000 480 L 1000 400 L 1070 400 L 1070 450 L 1110 450 L 1110 480 L 1152 480" 
        fill="none" stroke="url(#roofGlow)" stroke-width="1.6" />
</svg>
