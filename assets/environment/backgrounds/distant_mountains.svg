<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 648" width="1152" height="648">
  <defs>
    <!-- Distant Far Ridge Gradient -->
    <linearGradient id="farRidgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1d4e" />
      <stop offset="45%" stop-color="#1d143a" />
      <stop offset="100%" stop-color="#120c27" />
    </linearGradient>

    <!-- Near Mountain Ridge Gradient -->
    <linearGradient id="nearRidgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a153b" />
      <stop offset="50%" stop-color="#120e29" />
      <stop offset="100%" stop-color="#0a0818" />
    </linearGradient>

    <!-- Celestial Rim Light -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.30" />
    </linearGradient>
  </defs>

  <!-- Far Layer 1: Distant Crags & High Peaks (Starts at Y=340, ends at Y=340) -->
  <path d="M 0 340 
           Q 60 300 120 325 
           T 240 280 
           Q 320 250 400 310 
           T 560 270 
           Q 640 240 720 295 
           T 880 260 
           Q 960 280 1040 320 
           Q 1100 345 1152 340 
           L 1152 648 L 0 648 Z" 
        fill="url(#farRidgeGrad)" opacity="0.65" />

  <!-- Far Ridge Atmospheric Rim Highlight -->
  <path d="M 0 340 
           Q 60 300 120 325 
           T 240 280 
           Q 320 250 400 310 
           T 560 270 
           Q 640 240 720 295 
           T 880 260 
           Q 960 280 1040 320 
           Q 1100 345 1152 340" 
        fill="none" stroke="url(#rimGlow)" stroke-width="2.5" opacity="0.7" />

  <!-- Near Layer 2: Main Mountain Silhouette (Seamless at Y=400 on both ends) -->
  <path d="M 0 400 
           L 50 375 
           L 110 395 
           L 180 345 
           L 250 380 
           L 320 330 
           L 390 365 
           L 460 310 
           L 540 370 
           L 620 325 
           L 700 360 
           L 780 295 
           L 860 355 
           L 930 320 
           L 1010 385 
           L 1080 360 
           L 1152 400 
           L 1152 648 L 0 648 Z" 
        fill="url(#nearRidgeGrad)" />

  <!-- Mountain Peak Rim Edge Glow -->
  <path d="M 0 400 
           L 50 375 
           L 110 395 
           L 180 345 
           L 250 380 
           L 320 330 
           L 390 365 
           L 460 310 
           L 540 370 
           L 620 325 
           L 700 360 
           L 780 295 
           L 860 355 
           L 930 320 
           L 1010 385 
           L 1080 360 
           L 1152 400" 
        fill="none" stroke="#6366f1" stroke-width="1.8" opacity="0.45" />

  <!-- Subtle geological facets on peaks -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.15">
    <line x1="180" y1="345" x2="200" y2="400" />
    <line x1="320" y1="330" x2="345" y2="395" />
    <line x1="460" y1="310" x2="485" y2="380" />
    <line x1="620" y1="325" x2="600" y2="390" />
    <line x1="780" y1="295" x2="810" y2="375" />
    <line x1="930" y1="320" x2="950" y2="385" />
  </g>
</svg>
